<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">AI Film Camp Flare crescent lens study</title>
  <desc id="desc">Five Wider Still Flare variations with a dark circular lens and moon-shaped highlight.</desc>
  <defs>
    <style>
      .kicker { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2.4px; fill: #A7650D; }
      .heading { font: 650 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191715; }
      .name { font: 650 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191715; }
      .body { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6E6862; }
      .letter { font: 650 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; fill: #A7650D; }
      .label { font: 650 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.2px; fill: #9A938D; }
    </style>
    <path id="flame" d="M133 20c25 39 58 72 58 120 0 49-30 84-65 94-39-10-66-44-66-86 0-35 19-67 55-101-4 29 6 48 24 61 8-34 2-65-6-88Z"/>
    <symbol id="a" viewBox="0 0 256 256">
      <use href="#flame" fill="#F5A623" transform="translate(128 0) scale(1.3 1) translate(-128 0)"/><circle cx="126" cy="166" r="38" fill="#191715"/><circle cx="121" cy="160" r="27" fill="#FFF8ED"/><circle cx="132" cy="171" r="25" fill="#191715"/>
    </symbol>
    <symbol id="b" viewBox="0 0 256 256">
      <use href="#flame" fill="#F5A623" transform="translate(128 0) scale(1.3 1) translate(-128 0)"/><circle cx="126" cy="166" r="38" fill="#191715"/><circle cx="126" cy="166" r="30" fill="#FFF8ED"/><circle cx="133" cy="173" r="23" fill="#191715"/>
    </symbol>
    <symbol id="c" viewBox="0 0 256 256">
      <use href="#flame" fill="#F5A623" transform="translate(128 0) scale(1.3 1) translate(-128 0)"/><circle cx="126" cy="166" r="38" fill="#191715"/><circle cx="120" cy="159" r="28" fill="#FFF8ED"/><circle cx="135" cy="174" r="28" fill="#191715"/>
    </symbol>
    <symbol id="d" viewBox="0 0 256 256">
      <use href="#flame" fill="#F5A623" transform="translate(128 0) scale(1.3 1) translate(-128 0)"/><circle cx="126" cy="166" r="38" fill="#191715"/><circle cx="114" cy="153" r="20" fill="#FFF8ED"/><circle cx="122" cy="161" r="19" fill="#191715"/>
    </symbol>
    <symbol id="e" viewBox="0 0 256 256">
      <use href="#flame" fill="#F5A623" transform="translate(128 0) scale(1.3 1) translate(-128 0)"/><circle cx="126" cy="166" r="38" fill="#191715"/><circle cx="126" cy="166" r="31" fill="#FFF8ED"/><circle cx="133" cy="159" r="24" fill="#191715"/>
    </symbol>
  </defs>
  <rect width="1500" height="760" fill="#FFFFFF"/>
  <text x="52" y="55" class="kicker">AI FILM CAMP · WIDER STILL LENS STUDY</text>
  <text x="52" y="101" class="heading">A moon-shaped reflection inside the lens</text>
  <text x="52" y="132" class="body">130% flame width held constant · charcoal lens · warm-white crescent · transparent background</text>

  <g transform="translate(32 178)">
    <rect width="275" height="500" rx="18" fill="#FFFFFF" stroke="#E9E6E2"/>
    <text x="22" y="37" class="letter">A</text><text x="22" y="70" class="name">Classic Crescent</text><text x="22" y="94" class="body">Balanced and clearly lens-like.</text>
    <use href="#a" x="22" y="110" width="231" height="231"/>
    <text x="22" y="384" class="label">SMALL</text><use href="#a" x="22" y="400" width="38" height="38"/>
    <text x="94" y="384" class="label">DARK TILE</text><rect x="94" y="398" width="70" height="70" rx="18" fill="#191715"/><use href="#a" x="105" y="409" width="48" height="48"/>
  </g>
  <g transform="translate(322 178)">
    <rect width="275" height="500" rx="18" fill="#FFFFFF" stroke="#E9E6E2"/>
    <text x="22" y="37" class="letter">B</text><text x="22" y="70" class="name">Bold Halo</text><text x="22" y="94" class="body">Broadest, highest-contrast reflection.</text>
    <use href="#b" x="22" y="110" width="231" height="231"/>
    <text x="22" y="384" class="label">SMALL</text><use href="#b" x="22" y="400" width="38" height="38"/>
    <text x="94" y="384" class="label">DARK TILE</text><rect x="94" y="398" width="70" height="70" rx="18" fill="#191715"/><use href="#b" x="105" y="409" width="48" height="48"/>
  </g>
  <g transform="translate(612 178)">
    <rect width="275" height="500" rx="18" fill="#FFFFFF" stroke="#E9E6E2"/>
    <text x="22" y="37" class="letter">C</text><text x="22" y="70" class="name">Fine Sliver</text><text x="22" y="94" class="body">Sharper, quieter, and more technical.</text>
    <use href="#c" x="22" y="110" width="231" height="231"/>
    <text x="22" y="384" class="label">SMALL</text><use href="#c" x="22" y="400" width="38" height="38"/>
    <text x="94" y="384" class="label">DARK TILE</text><rect x="94" y="398" width="70" height="70" rx="18" fill="#191715"/><use href="#c" x="105" y="409" width="48" height="48"/>
  </g>
  <g transform="translate(902 178)">
    <rect width="275" height="500" rx="18" fill="#FFFFFF" stroke="#E9E6E2"/>
    <text x="22" y="37" class="letter">D</text><text x="22" y="70" class="name">High Glint</text><text x="22" y="94" class="body">Smallest and most understated highlight.</text>
    <use href="#d" x="22" y="110" width="231" height="231"/>
    <text x="22" y="384" class="label">SMALL</text><use href="#d" x="22" y="400" width="38" height="38"/>
    <text x="94" y="384" class="label">DARK TILE</text><rect x="94" y="398" width="70" height="70" rx="18" fill="#191715"/><use href="#d" x="105" y="409" width="48" height="48"/>
  </g>
  <g transform="translate(1192 178)">
    <rect width="275" height="500" rx="18" fill="#FFFFFF" stroke="#E9E6E2"/>
    <text x="22" y="37" class="letter">E</text><text x="22" y="70" class="name">Crescent Sweep</text><text x="22" y="94" class="body">Closest to the attached C-shaped moon.</text>
    <use href="#e" x="22" y="110" width="231" height="231"/>
    <text x="22" y="384" class="label">SMALL</text><use href="#e" x="22" y="400" width="38" height="38"/>
    <text x="94" y="384" class="label">DARK TILE</text><rect x="94" y="398" width="70" height="70" rx="18" fill="#191715"/><use href="#e" x="105" y="409" width="48" height="48"/>
  </g>
</svg>
