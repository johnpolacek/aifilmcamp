<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">AI Film Camp Flare C slightly larger lens comparison</title>
  <desc id="desc">The selected Flare C logo beside a version with the complete lens assembly enlarged uniformly by eight percent.</desc>
  <defs>
    <style>
      .kicker { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2.4px; fill: #A7650D; }
      .heading { font: 650 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191715; }
      .name { font: 650 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191715; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6E6862; }
      .label { font: 650 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.2px; fill: #9A938D; }
    </style>
    <mask id="original-mask" maskUnits="userSpaceOnUse">
      <rect width="256" height="256" fill="#FFF"/>
      <circle cx="126" cy="166" r="37" fill="none" stroke="#000" stroke-width="9"/>
      <circle cx="126" cy="166" r="21" fill="#000"/>
      <circle cx="132" cy="166" r="17" fill="#FFF"/>
    </mask>
    <mask id="larger-mask" maskUnits="userSpaceOnUse">
      <rect width="256" height="256" fill="#FFF"/>
      <g transform="translate(126 166) scale(1.08) translate(-126 -166)">
        <circle cx="126" cy="166" r="37" fill="none" stroke="#000" stroke-width="9"/>
        <circle cx="126" cy="166" r="21" fill="#000"/>
        <circle cx="132" cy="166" r="17" fill="#FFF"/>
      </g>
    </mask>
    <symbol id="original" viewBox="0 0 256 256"><path d="M133 20c25 39 58 72 58 120 0 49-30 84-65 94-39-10-66-44-66-86 0-35 19-67 55-101-4 29 6 48 24 61 8-34 2-65-6-88Z" fill="currentColor" mask="url(#original-mask)" transform="translate(128 0) scale(1.3 1) translate(-128 0)"/></symbol>
    <symbol id="larger" viewBox="0 0 256 256"><path d="M133 20c25 39 58 72 58 120 0 49-30 84-65 94-39-10-66-44-66-86 0-35 19-67 55-101-4 29 6 48 24 61 8-34 2-65-6-88Z" fill="currentColor" mask="url(#larger-mask)" transform="translate(128 0) scale(1.3 1) translate(-128 0)"/></symbol>
  </defs>
  <rect width="1100" height="680" fill="#FBFAF8"/>
  <text x="52" y="55" class="kicker">AI FILM CAMP · FLARE C REFINEMENT</text>
  <text x="52" y="101" class="heading">A little more lens presence.</text>
  <text x="52" y="132" class="body">The flame is unchanged. The ring and C scale together, preserving their exact proportions.</text>

  <g transform="translate(50 174)">
    <rect width="480" height="430" rx="20" fill="#FFF" stroke="#E9E6E2"/>
    <text x="24" y="39" class="label">REFERENCE</text>
    <use href="#original" x="115" y="62" width="250" height="250" color="#F5A623"/>
    <text x="24" y="351" class="name">Original size</text>
    <text x="24" y="380" class="body">Selected Flare C candidate</text>
  </g>
  <g transform="translate(570 174)">
    <rect width="480" height="430" rx="20" fill="#FFF" stroke="#E9E6E2"/>
    <text x="24" y="39" class="label">REFINEMENT</text>
    <use href="#larger" x="115" y="62" width="250" height="250" color="#F5A623"/>
    <text x="24" y="351" class="name">Lens + C enlarged 8%</text>
    <text x="24" y="380" class="body">Same center and internal proportions</text>
  </g>
  <text x="52" y="645" class="body">Amber #F5A623 · transparent negative space · production files include amber, charcoal, and white</text>
</svg>
