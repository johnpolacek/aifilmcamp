<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Film Camp clean modern logo concepts, round two</title>
  <desc id="desc">Four reduced amber marks shown in color, small, monochrome, and reversed applications.</desc>
  <defs>
    <style>
      .kicker { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2.5px; fill: #A7650D; }
      .heading { font: 650 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191715; }
      .name { font: 650 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191715; }
      .body { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #68625D; }
      .label { font: 650 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; fill: #9A938D; }
    </style>
    <symbol id="flare" viewBox="0 0 256 256">
      <path fill="currentColor" fill-rule="evenodd" d="M133 20c25 39 58 72 58 120 0 49-30 84-65 94-39-10-66-44-66-86 0-35 19-67 55-101-4 29 6 48 24 61 8-34 2-65-6-88Zm-7 108a38 38 0 1 0 0 76 38 38 0 0 0 0-76Z"/>
    </symbol>
    <symbol id="disc" viewBox="0 0 256 256">
      <path fill="currentColor" fill-rule="evenodd" d="M128 22a106 106 0 1 1 0 212 106 106 0 0 1 0-212Zm5 53c-6 23-1 41 12 55 11 12 17 26 15 42-2 20-16 35-34 38-21-3-35-20-35-41 0-16 8-31 24-46-2 14 3 23 12 30 5-24 7-50 6-78Z"/>
    </symbol>
    <symbol id="camp-color" viewBox="0 0 256 256">
      <path fill="#F5A623" d="M132 28c22 32 45 59 45 96 0 37-21 64-51 72-32-8-53-36-53-70 0-27 15-51 42-77-3 22 5 36 20 47 6-27 2-50-3-68Z"/>
      <rect x="59" y="190" width="146" height="18" rx="9" fill="#191715" transform="rotate(23 132 199)"/>
      <rect x="59" y="190" width="146" height="18" rx="9" fill="#191715" transform="rotate(-23 132 199)"/>
    </symbol>
    <symbol id="camp-mono" viewBox="0 0 256 256">
      <path fill="currentColor" d="M132 28c22 32 45 59 45 96 0 37-21 64-51 72-32-8-53-36-53-70 0-27 15-51 42-77-3 22 5 36 20 47 6-27 2-50-3-68Z"/>
      <rect x="59" y="190" width="146" height="18" rx="9" fill="currentColor" transform="rotate(23 132 199)"/>
      <rect x="59" y="190" width="146" height="18" rx="9" fill="currentColor" transform="rotate(-23 132 199)"/>
    </symbol>
    <path id="tri-blade" d="M128 24c34 8 61 28 79 55l-69 45c-2-15-11-28-27-37Z"/>
    <symbol id="tri" viewBox="0 0 256 256">
      <g fill="currentColor">
        <use href="#tri-blade"/>
        <use href="#tri-blade" transform="rotate(120 128 128)"/>
        <use href="#tri-blade" transform="rotate(240 128 128)"/>
      </g>
    </symbol>
  </defs>

  <rect width="1440" height="900" fill="#FFFFFF"/>
  <text x="64" y="58" class="kicker">AI FILM CAMP · ROUND 2</text>
  <text x="64" y="105" class="heading">Cleaner. Flatter. More modern.</text>
  <text x="64" y="136" class="body">Reduced geometry · one amber · strong negative space · no gradients</text>

  <g transform="translate(52 172)">
    <rect width="650" height="310" rx="18" fill="#FFFFFF" stroke="#E9E6E2"/>
    <text x="28" y="40" class="kicker">01</text><text x="28" y="76" class="name">Flare</text>
    <text x="28" y="102" class="body">A flame silhouette with a lens at its center.</text>
    <use href="#flare" x="38" y="120" width="162" height="162" color="#F5A623"/>
    <text x="262" y="146" class="label">SMALL</text><use href="#flare" x="262" y="161" width="38" height="38" color="#191715"/>
    <text x="348" y="146" class="label">MONO</text><use href="#flare" x="348" y="157" width="72" height="72" color="#191715"/>
    <text x="470" y="146" class="label">REVERSED</text><rect x="470" y="158" width="96" height="96" rx="22" fill="#191715"/><use href="#flare" x="484" y="172" width="68" height="68" color="#FFFFFF"/>
  </g>
  <g transform="translate(738 172)">
    <rect width="650" height="310" rx="18" fill="#FFFFFF" stroke="#E9E6E2"/>
    <text x="28" y="40" class="kicker">02</text><text x="28" y="76" class="name">Ember Disc</text>
    <text x="28" y="102" class="body">A lens reduced to a disc, with fire in negative space.</text>
    <use href="#disc" x="38" y="120" width="162" height="162" color="#F5A623"/>
    <text x="262" y="146" class="label">SMALL</text><use href="#disc" x="262" y="161" width="38" height="38" color="#191715"/>
    <text x="348" y="146" class="label">MONO</text><use href="#disc" x="348" y="157" width="72" height="72" color="#191715"/>
    <text x="470" y="146" class="label">REVERSED</text><rect x="470" y="158" width="96" height="96" rx="22" fill="#191715"/><use href="#disc" x="484" y="172" width="68" height="68" color="#FFFFFF"/>
  </g>
  <g transform="translate(52 520)">
    <rect width="650" height="310" rx="18" fill="#FFFFFF" stroke="#E9E6E2"/>
    <text x="28" y="40" class="kicker">03</text><text x="28" y="76" class="name">Camp Signal</text>
    <text x="28" y="102" class="body">The literal idea, reduced to three geometric parts.</text>
    <use href="#camp-color" x="38" y="120" width="162" height="162"/>
    <text x="262" y="146" class="label">SMALL</text><use href="#camp-mono" x="262" y="161" width="38" height="38" color="#191715"/>
    <text x="348" y="146" class="label">MONO</text><use href="#camp-mono" x="348" y="157" width="72" height="72" color="#191715"/>
    <text x="470" y="146" class="label">REVERSED</text><rect x="470" y="158" width="96" height="96" rx="22" fill="#191715"/><use href="#camp-mono" x="484" y="172" width="68" height="68" color="#FFFFFF"/>
  </g>
  <g transform="translate(738 520)">
    <rect width="650" height="310" rx="18" fill="#FFFFFF" stroke="#E9E6E2"/>
    <text x="28" y="40" class="kicker">04</text><text x="28" y="76" class="name">Tri Iris</text>
    <text x="28" y="102" class="body">A three-blade shutter with a fast, abstract energy.</text>
    <use href="#tri" x="38" y="120" width="162" height="162" color="#F5A623"/>
    <text x="262" y="146" class="label">SMALL</text><use href="#tri" x="262" y="161" width="38" height="38" color="#191715"/>
    <text x="348" y="146" class="label">MONO</text><use href="#tri" x="348" y="157" width="72" height="72" color="#191715"/>
    <text x="470" y="146" class="label">REVERSED</text><rect x="470" y="158" width="96" height="96" rx="22" fill="#191715"/><use href="#tri" x="484" y="172" width="68" height="68" color="#FFFFFF"/>
  </g>
</svg>
