  <rect width="1440" height="900" fill="#FFF8ED"/>
  <text x="60" y="56" class="eyebrow">AI FILM CAMP</text>
  <text x="60" y="96" class="name" font-size="34">Four mark directions</text>
  <text x="60" y="125" class="body">Cinematic · innovative · fun · warm · creative</text>

  <g transform="translate(50 155)">
    <rect width="650" height="320" rx="28" fill="#FFFFFF"/>
    <text x="28" y="42" class="eyebrow">01</text><text x="28" y="78" class="name">Lensfire</text>
    <text x="28" y="105" class="body">The clearest fusion: cinematic sight + creative spark.</text>
    <use href="#lensfire-color" x="38" y="124" width="170" height="170"/>
    <text x="262" y="151" class="caption">SMALL</text><use href="#lensfire-dark" x="262" y="167" width="42" height="42"/>
    <text x="347" y="151" class="caption">MONO</text><use href="#lensfire-dark" x="347" y="164" width="74" height="74"/>
    <text x="470" y="151" class="caption">REVERSED</text><rect x="470" y="164" width="104" height="104" rx="24" fill="#241C16"/><use href="#lensfire-light" x="482" y="176" width="80" height="80"/>
  </g>
  <g transform="translate(740 155)">
    <rect width="650" height="320" rx="28" fill="#FFFFFF"/>
    <text x="28" y="42" class="eyebrow">02</text><text x="28" y="78" class="name">Ember Iris</text>
    <text x="28" y="105" class="body">An aperture in motion, organized around the flame.</text>
    <use href="#iris-color" x="38" y="124" width="170" height="170"/>
    <text x="262" y="151" class="caption">SMALL</text><use href="#iris-dark" x="262" y="167" width="42" height="42"/>
    <text x="347" y="151" class="caption">MONO</text><use href="#iris-dark" x="347" y="164" width="74" height="74"/>
    <text x="470" y="151" class="caption">REVERSED</text><rect x="470" y="164" width="104" height="104" rx="24" fill="#241C16"/><use href="#iris-light" x="482" y="176" width="80" height="80"/>
  </g>
  <g transform="translate(50 515)">
    <rect width="650" height="320" rx="28" fill="#FFFFFF"/>
    <text x="28" y="42" class="eyebrow">03</text><text x="28" y="78" class="name">Focus Flame</text>
    <text x="28" y="105" class="body">A playful production mark: bring the idea into focus.</text>
    <use href="#focus-color" x="38" y="124" width="170" height="170"/>
    <text x="262" y="151" class="caption">SMALL</text><use href="#focus-dark" x="262" y="167" width="42" height="42"/>
    <text x="347" y="151" class="caption">MONO</text><use href="#focus-dark" x="347" y="164" width="74" height="74"/>
    <text x="470" y="151" class="caption">REVERSED</text><rect x="470" y="164" width="104" height="104" rx="24" fill="#241C16"/><use href="#focus-light" x="482" y="176" width="80" height="80"/>
  </g>
  <g transform="translate(740 515)">
    <rect width="650" height="320" rx="28" fill="#FFFFFF"/>
    <text x="28" y="42" class="eyebrow">04</text><text x="28" y="78" class="name">Shutter Blaze</text>
    <text x="28" y="105" class="body">Three fluid blades become a more ownable abstract fire.</text>
    <use href="#blaze-color" x="38" y="124" width="170" height="170"/>
    <text x="262" y="151" class="caption">SMALL</text><use href="#blaze-dark" x="262" y="167" width="42" height="42"/>
    <text x="347" y="151" class="caption">MONO</text><use href="#blaze-dark" x="347" y="164" width="74" height="74"/>
    <text x="470" y="151" class="caption">REVERSED</text><rect x="470" y="164" width="104" height="104" rx="24" fill="#241C16"/><use href="#blaze-light" x="482" y="176" width="80" height="80"/>
