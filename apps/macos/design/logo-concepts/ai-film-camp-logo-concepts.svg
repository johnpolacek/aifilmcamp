<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="board-title board-desc">
  <title id="board-title">AI Film Camp logo concepts</title>
  <desc id="board-desc">Four clean amber logo concepts shown at primary, small, monochrome, and reversed sizes.</desc>
