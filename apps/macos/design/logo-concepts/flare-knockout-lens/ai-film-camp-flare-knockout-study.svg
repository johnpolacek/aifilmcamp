<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">AI Film Camp monochrome knockout lens study</title>
  <desc id="desc">Five one-color Wider Still Flare variations with a circular outline and crescent moon knocked out as negative space.</desc>
  <defs>
    <style>
      .kicker { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2.4px; fill: #A7650D; }
      .heading { font: 650 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191715; }
      .name { font: 650 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191715; }
      .body { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6E6862; }
      .letter { font: 650 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; fill: #A7650D; }
      .label { font: 650 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.2px; fill: #9A938D; }
    </style>
    <path id="flame" d="M133 20c25 39 58 72 58 120 0 49-30 84-65 94-39-10-66-44-66-86 0-35 19-67 55-101-4 29 6 48 24 61 8-34 2-65-6-88Z"/>
    <mask id="ma" maskUnits="userSpaceOnUse"><rect width="256" height="256" fill="#FFF"/><circle cx="126" cy="166" r="34" fill="none" stroke="#000" stroke-width="7"/><circle cx="116" cy="156" r="17" fill="#000"/><circle cx="123" cy="163" r="15" fill="#FFF"/></mask>
    <mask id="mb" maskUnits="userSpaceOnUse"><rect width="256" height="256" fill="#FFF"/><circle cx="126" cy="166" r="34" fill="none" stroke="#000" stroke-width="7"/><circle cx="118" cy="158" r="19" fill="#000"/><circle cx="126" cy="166" r="15" fill="#FFF"/></mask>
    <mask id="mc" maskUnits="userSpaceOnUse"><rect width="256" height="256" fill="#FFF"/><circle cx="126" cy="166" r="34" fill="none" stroke="#000" stroke-width="7"/><circle cx="118" cy="158" r="18" fill="#000"/><circle cx="127" cy="167" r="18" fill="#FFF"/></mask>
    <mask id="md" maskUnits="userSpaceOnUse"><rect width="256" height="256" fill="#FFF"/><circle cx="126" cy="166" r="34" fill="none" stroke="#000" stroke-width="7"/><circle cx="114" cy="154" r="14" fill="#000"/><circle cx="120" cy="160" r="13" fill="#FFF"/></mask>
    <mask id="me" maskUnits="userSpaceOnUse"><rect width="256" height="256" fill="#FFF"/><circle cx="126" cy="166" r="34" fill="none" stroke="#000" stroke-width="7"/><circle cx="126" cy="166" r="24" fill="#000"/><circle cx="132" cy="159" r="20" fill="#FFF"/></mask>
    <symbol id="a" viewBox="0 0 256 256"><g mask="url(#ma)"><use href="#flame" fill="currentColor" transform="translate(128 0) scale(1.3 1) translate(-128 0)"/></g></symbol>
    <symbol id="b" viewBox="0 0 256 256"><g mask="url(#mb)"><use href="#flame" fill="currentColor" transform="translate(128 0) scale(1.3 1) translate(-128 0)"/></g></symbol>
    <symbol id="c" viewBox="0 0 256 256"><g mask="url(#mc)"><use href="#flame" fill="currentColor" transform="translate(128 0) scale(1.3 1) translate(-128 0)"/></g></symbol>
    <symbol id="d" viewBox="0 0 256 256"><g mask="url(#md)"><use href="#flame" fill="currentColor" transform="translate(128 0) scale(1.3 1) translate(-128 0)"/></g></symbol>
    <symbol id="e" viewBox="0 0 256 256"><g mask="url(#me)"><use href="#flame" fill="currentColor" transform="translate(128 0) scale(1.3 1) translate(-128 0)"/></g></symbol>
  </defs>
  <rect width="1500" height="760" fill="#FFFFFF"/>
  <text x="52" y="55" class="kicker">AI FILM CAMP · MONOCHROME LENS STUDY</text>
  <text x="52" y="101" class="heading">One color. Circle outline. Crescent moon.</text>
  <text x="52" y="132" class="body">130% Wider Still flame · lens and moon are transparent knockouts · no black or painted white</text>

  <g transform="translate(32 178)">
    <rect width="275" height="500" rx="18" fill="#FFF" stroke="#E9E6E2"/><text x="22" y="37" class="letter">A</text><text x="22" y="70" class="name">Balanced Moon</text><text x="22" y="94" class="body">Even weight and clear separation.</text>
    <use href="#a" x="22" y="110" width="231" height="231" color="#F5A623"/><text x="22" y="384" class="label">SMALL</text><use href="#a" x="22" y="400" width="38" height="38" color="#F5A623"/><text x="94" y="384" class="label">REVERSED</text><rect x="94" y="398" width="70" height="70" rx="18" fill="#191715"/><use href="#a" x="105" y="409" width="48" height="48" color="#FFF"/>
  </g>
  <g transform="translate(322 178)">
    <rect width="275" height="500" rx="18" fill="#FFF" stroke="#E9E6E2"/><text x="22" y="37" class="letter">B</text><text x="22" y="70" class="name">Bold Moon</text><text x="22" y="94" class="body">Thicker crescent with more presence.</text>
    <use href="#b" x="22" y="110" width="231" height="231" color="#F5A623"/><text x="22" y="384" class="label">SMALL</text><use href="#b" x="22" y="400" width="38" height="38" color="#F5A623"/><text x="94" y="384" class="label">REVERSED</text><rect x="94" y="398" width="70" height="70" rx="18" fill="#191715"/><use href="#b" x="105" y="409" width="48" height="48" color="#FFF"/>
  </g>
  <g transform="translate(612 178)">
    <rect width="275" height="500" rx="18" fill="#FFF" stroke="#E9E6E2"/><text x="22" y="37" class="letter">C</text><text x="22" y="70" class="name">Fine Sliver</text><text x="22" y="94" class="body">Quietest and most technical.</text>
    <use href="#c" x="22" y="110" width="231" height="231" color="#F5A623"/><text x="22" y="384" class="label">SMALL</text><use href="#c" x="22" y="400" width="38" height="38" color="#F5A623"/><text x="94" y="384" class="label">REVERSED</text><rect x="94" y="398" width="70" height="70" rx="18" fill="#191715"/><use href="#c" x="105" y="409" width="48" height="48" color="#FFF"/>
  </g>
  <g transform="translate(902 178)">
    <rect width="275" height="500" rx="18" fill="#FFF" stroke="#E9E6E2"/><text x="22" y="37" class="letter">D</text><text x="22" y="70" class="name">High Moon</text><text x="22" y="94" class="body">Compact highlight, placed higher.</text>
    <use href="#d" x="22" y="110" width="231" height="231" color="#F5A623"/><text x="22" y="384" class="label">SMALL</text><use href="#d" x="22" y="400" width="38" height="38" color="#F5A623"/><text x="94" y="384" class="label">REVERSED</text><rect x="94" y="398" width="70" height="70" rx="18" fill="#191715"/><use href="#d" x="105" y="409" width="48" height="48" color="#FFF"/>
  </g>
  <g transform="translate(1192 178)">
    <rect width="275" height="500" rx="18" fill="#FFF" stroke="#E9E6E2"/><text x="22" y="37" class="letter">E</text><text x="22" y="70" class="name">Crescent Sweep</text><text x="22" y="94" class="body">Broad C-shaped inner moon.</text>
    <use href="#e" x="22" y="110" width="231" height="231" color="#F5A623"/><text x="22" y="384" class="label">SMALL</text><use href="#e" x="22" y="400" width="38" height="38" color="#F5A623"/><text x="94" y="384" class="label">REVERSED</text><rect x="94" y="398" width="70" height="70" rx="18" fill="#191715"/><use href="#e" x="105" y="409" width="48" height="48" color="#FFF"/>
  </g>
</svg>
