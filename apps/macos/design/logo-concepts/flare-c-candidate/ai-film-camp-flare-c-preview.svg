<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI Film Camp Flare C candidate preview</title>
  <desc id="desc">The one-color Flare candidate shown in amber, charcoal, reversed white, and small sizes.</desc>
  <defs>
    <style>
      .kicker { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2.4px; fill: #A7650D; }
      .heading { font: 650 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191715; }
      .name { font: 650 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191715; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6E6862; }
      .label { font: 650 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.2px; fill: #9A938D; }
    </style>
    <mask id="knockout" maskUnits="userSpaceOnUse"><rect width="256" height="256" fill="#FFF"/><circle cx="126" cy="166" r="37" fill="none" stroke="#000" stroke-width="9"/><circle cx="126" cy="166" r="21" fill="#000"/><circle cx="132" cy="166" r="17" fill="#FFF"/></mask>
    <symbol id="mark" viewBox="0 0 256 256"><g mask="url(#knockout)"><path d="M133 20c25 39 58 72 58 120 0 49-30 84-65 94-39-10-66-44-66-86 0-35 19-67 55-101-4 29 6 48 24 61 8-34 2-65-6-88Z" fill="currentColor" transform="translate(128 0) scale(1.3 1) translate(-128 0)"/></g></symbol>
  </defs>
  <rect width="1200" height="720" fill="#FFF"/>
  <text x="54" y="56" class="kicker">AI FILM CAMP · FLARE C CANDIDATE</text>
  <text x="54" y="102" class="heading">Thicker ring. Right-facing crescent.</text>
  <text x="54" y="133" class="body">One vector construction · transparent knockouts · amber, charcoal, and reversed white</text>

  <g transform="translate(50 180)"><rect width="340" height="410" rx="20" fill="#FFF" stroke="#E9E6E2"/><text x="24" y="39" class="label">PRIMARY AMBER</text><use href="#mark" x="52" y="82" width="236" height="236" color="#F5A623"/><text x="24" y="375" class="body">Transparent background</text></g>
  <g transform="translate(430 180)"><rect width="340" height="410" rx="20" fill="#FFF8ED"/><text x="24" y="39" class="label">MONOCHROME DARK</text><use href="#mark" x="52" y="82" width="236" height="236" color="#191715"/><text x="24" y="375" class="body">Single charcoal ink</text></g>
  <g transform="translate(810 180)"><rect width="340" height="410" rx="20" fill="#191715"/><text x="24" y="39" class="label" fill="#FFF">REVERSED WHITE</text><use href="#mark" x="52" y="82" width="236" height="236" color="#FFF"/><text x="24" y="375" class="body" fill="#FFF">Single white ink</text></g>

  <text x="54" y="642" class="label">SMALL-SIZE CHECK</text>
  <use href="#mark" x="222" y="617" width="24" height="24" color="#191715"/><use href="#mark" x="270" y="613" width="32" height="32" color="#191715"/><use href="#mark" x="326" y="605" width="48" height="48" color="#191715"/>
  <text x="225" y="673" class="body">24</text><text x="277" y="673" class="body">32</text><text x="342" y="673" class="body">48 px</text>
</svg>
