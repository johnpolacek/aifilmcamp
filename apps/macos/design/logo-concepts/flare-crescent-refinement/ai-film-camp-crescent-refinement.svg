<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">AI Film Camp Crescent Sweep refinement</title>
  <desc id="desc">Five one-color variations progressively enlarge the lens ring and reduce the inner crescent.</desc>
  <defs>
