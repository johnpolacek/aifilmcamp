  <rect width="1500" height="760" fill="#FFF"/>
  <text x="52" y="55" class="kicker">AI FILM CAMP · CRESCENT SWEEP REFINEMENT</text>
  <text x="52" y="101" class="heading">Larger lens. Smaller moon.</text>
  <text x="52" y="132" class="body">130% flame and 7-unit ring weight held constant · every detail remains a transparent knockout</text>

