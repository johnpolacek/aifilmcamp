    <mask id="md" maskUnits="userSpaceOnUse"><rect width="256" height="256" fill="#FFF"/><circle cx="126" cy="166" r="39" fill="none" stroke="#000" stroke-width="7"/><circle cx="126" cy="166" r="19" fill="#000"/><circle cx="130.5" cy="160.5" r="15" fill="#FFF"/></mask>
